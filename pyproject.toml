[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legalmind-ai"
version = "0.1.0"
description = "Intelligent Legal Case Assistant — Azure AI-powered platform for legal document analysis, retrieval, and agentic workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Munyaradzi Zhou" }]

dependencies = [
    # Azure AI Services
    "azure-ai-formrecognizer>=3.3.0",
    "azure-ai-textanalytics>=5.3.0",
    "azure-ai-translation-text>=1.0.0",
    "azure-ai-contentsafety>=1.0.0",
    "azure-search-documents>=11.6.0",
    "azure-cognitiveservices-speech>=1.37.0",

    # Azure OpenAI / AI Foundry
    "openai>=1.40.0",

    # Azure Infrastructure
    "azure-identity>=1.16.0",
    "aiohttp>=3.9.0",  # transport for the Azure SDKs' async (.aio) clients
    "azure-keyvault-secrets>=4.8.0",
    "azure-storage-blob>=12.20.0",
    "azure-cosmos>=4.7.0",
    "azure-monitor-opentelemetry>=1.4.0",

    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",

    # Agentic Framework
    "semantic-kernel>=1.41.0",  # >=1.39.4 fixes PYSEC-2026-163 / PYSEC-2026-531
    "azure-ai-agents>=1.2.0b3",  # pre-release required by semantic-kernel>=1.39.4
    "werkzeug>=3.1.9",  # transitive (openapi-core); floor for PYSEC-2026-2044/2046/2320/4312

    # Data & Processing
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",

    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b25",
    "structlog>=24.2.0",

    # Utilities
    "httpx>=0.27.0",
    "mcp>=1.9.0",  # Model Context Protocol server (legalmind-mcp)
    "PyJWT[crypto]>=2.8.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "truststore>=0.9.0",  # evaluations and traffic script: use the OS certificate store
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]
frontend = [
    "streamlit>=1.50.0",
    "streamlit-chat>=0.1.1",
]
notebooks = [
    "jupyter>=1.0.0",
    "nbconvert>=7.16.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
]

[project.scripts]
legalmind = "legalmind.main:start"
legalmind-mcp = "legalmind.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legalmind"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads route parameter annotations at runtime, so request models used in
# route signatures must NOT be moved into `if TYPE_CHECKING:` blocks.
"src/legalmind/api/routes/*" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["legalmind"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring Azure credentials",
    "evaluation: marks AI evaluation tests",
]
